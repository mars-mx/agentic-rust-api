[package]
name = "app"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
db = { version = "0.0.0", path = "../db" }
domain = { version = "0.0.0", path = "../domain" }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "uuid", "migrate"] }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
