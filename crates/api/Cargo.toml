[package]
name = "api"
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
app = { version = "0.0.0", path = "../app" }
axum = "0.8.9"
clerk-rs = "0.5.0"
domain = { version = "0.0.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.29.2", features = ["serde"] }

[dev-dependencies]
async-trait = "0.1"
jsonwebtoken = "9.3.1"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
