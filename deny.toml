
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
private = { ignore = true }
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # TLS is rustls only.
  { crate = "openssl", reason = "TLS is rustls only." },
  { crate = "openssl-sys", reason = "TLS is rustls only." },
  { crate = "native-tls", reason = "TLS is rustls only." },
  # Database access is sqlx only.
  { crate = "tokio-postgres", reason = "Database access is sqlx only." },
  { crate = "postgres", reason = "Database access is sqlx only." },
  { crate = "deadpool-postgres", reason = "The pool is the one sqlx ships with." },
  { crate = "bb8", reason = "The pool is the one sqlx ships with." },
  { crate = "diesel", reason = "No ORM." },
  { crate = "sea-orm", reason = "No ORM." },
]
