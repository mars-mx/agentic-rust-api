id: config-secrets-typed
language: rust
severity: error
message: A secret config value has the type SecretString.
note: SecretString keeps the value out of Debug output and logs.
files:
  - crates/config/src/**/*.rs
rule:
  all:
    - kind: field_declaration
    - has:
        field: name
        regex: '(?i)(secret|password|passwd|token|_key|database_url|dsn)$'
    - not:
        has:
          field: type
          regex: '\bSecret(String|Box)\b'
