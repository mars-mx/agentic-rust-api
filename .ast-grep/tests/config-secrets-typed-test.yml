id: config-secrets-typed
valid:
  - |
    pub struct Config { pub database_url: SecretString, pub fernet_key: SecretString, pub jwks_url: Url }
invalid:
  - |
    pub struct Config { pub database_url: String }
  - |
    pub struct Config { pub fernet_key: String }
  - |
    pub struct Config { pub nats_token: String }
